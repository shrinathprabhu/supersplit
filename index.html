              {
                "@type": "Question",
                "name": "Is SuperSplit free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. SuperSplit is completely free, has no accounts, no subscriptions and no adverts. It is open source on GitHub."
                }
              },
              {
                "@type": "Question",
                "name": "Does SuperSplit work offline?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. It is a progressive web app that caches itself on first visit, so it keeps working with no connection at all. You can install it to your home screen and use it on a flight or abroad without data."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need an account to split bills?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. There is no sign up and no server. Every group, expense and settlement is stored in your own browser using IndexedDB, and nothing is ever uploaded."
                }
              },
              {
                "@type": "Question",
                "name": "How does SuperSplit handle GST, service charge and other taxes?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You enter the amount before tax, then attach as many taxes and fees as the bill has, each either a percentage or a flat amount. Each one is spread either by share, in proportion to what each person consumed, or equally for flat per-head charges."
                }
              },
              {
                "@type": "Question",
                "name": "Can SuperSplit round off the bill like a restaurant does?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Turn on round off and choose nearest whole unit, which follows the GST rule where 50 paise and over rounds up, or always round up, or type the exact total printed on the bill. The difference is spread across the same split so the shares still add up to the printed total."
                }
              },
              {
                "@type": "Question",
                "name": "Can SuperSplit scan a receipt?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Choose or photograph an image receipt and SuperSplit uses an English OCR model running entirely in your browser to find the printed total and legible tax or fee lines. The image is never uploaded or saved, and every extracted value remains editable so you can check it against the bill before saving."
                }
              },
              {
                "@type": "Question",
                "name": "What is the difference between actual debts and simplified debts?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Actual debts means everyone pays back whoever covered them, with debts inside a pair and circular debt cancelled out. Simplified debts re-routes the same balances into the fewest possible payments, so there are fewer transfers but you may end up paying someone you never shared a bill with. Both views leave every person in exactly the same position, and settling in one updates the other."
                }
              },
              {
                "@type": "Question",
                "name": "Can I share who owes what?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Any group summary or single debt can be shared as WhatsApp ready text, a PNG card, or a detailed PDF statement listing every expense, its taxes, who paid and what each person owes. Each goes to the system share sheet or downloads."

              },

                "@type": "Question",
                "name": "Can I move my data to another browser or phone?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Export the whole profile or a single group as a JSON file and import it anywhere. Groups carry stable random ids, so re-importing a group you already have merges into it, showing you any conflicts or possible duplicates before anything is written."
                }
              },

                "@type": "Question",

    <noscript>
      <div class="noscript">
        <h2>SuperSplit needs JavaScript</h2>
        <p>
          Everything runs locally in your browser and nothing is sent anywhere, but that does mean the app itself is
          JavaScript. Turn it on to use SuperSplit.
        </p>
        <h3>What SuperSplit does</h3>
        <ul>
          <li>Split a bill equally, by exact amounts, by percentage or by shares, and leave anyone out who was not in on it.</li>
          <li>Add GST, service charge or any other tax and fee, as a percentage or a flat amount, spread by share or equally.</li>
          <li>Scan an image receipt on the device to suggest its total and legible tax or fee lines, then review every value.</li>
          <li>Round the total the way the shop did: nearest whole unit, always up, or the exact figure printed on the bill.</li>
          <li>Record several people paying one bill, equally or in different amounts.</li>
          <li>See who owes whom as actual debts, or simplified into the fewest possible payments, and settle up in full or in part.</li>
          <li>Share a summary or a single receipt as WhatsApp text, a PNG or a detailed PDF.</li>
          <li>Chart daily spend for a group and across every group.</li>
          <li>Export and import a profile or a single group as JSON, with conflicts and duplicates shown before anything is written.</li>
        </ul>
        <p>
          It is a free, open source progressive web app with no account, no server and no tracking.
          <a href="https://github.com/shrinathprabhu/supersplit">Source on GitHub</a>. Built by
          <a href="https://shrinath.me">Shrinath Prabhu</a>, from the makers of
          <a href="https://owleye.dev">OwlEye Analytics</a>. More tools at <a href="https://lowkey.tools">lowkey.tools</a>.
        </p>
        <p>

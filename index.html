<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <title>SuperSplit, the offline bill splitter</title>
    <meta name="description" content="Split bills with friends. Taxes, uneven payers, simplified debts, shareable receipts. Works offline, no account, nothing leaves your device." />
    <meta name="theme-color" content="#07060D" />
    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SuperSplit" />

    <link rel="preload" href="./assets/fonts/geist-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="app">
      <div class="screen">
        <div class="content" style="padding-top: 22vh; text-align: center">
          <div class="spinner" style="margin: 0 auto 14px"></div>
          <div class="small muted">Opening SuperSplit…</div>
        </div>
      </div>
    </div>

    <noscript>
      <div style="padding: 32px; text-align: center">
        <h1>SuperSplit</h1>
        <p>This app needs JavaScript. Everything runs locally in your browser and nothing is sent anywhere.</p>
      </div>
    </noscript>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
